name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      # I can't be bothered to keep uploading the build
      # get the filename
      - name: Get JAR Filename
        id: jar
        shell: bash
        run: |
          file=(build/libs/*.jar)
          echo "name=$(basename "${file[0]}")" >> "$GITHUB_OUTPUT"

      # upload the thing
      - name: Upload Gradle Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar.outputs.name }}
          path: build/libs/*.jar
          overwrite: true
